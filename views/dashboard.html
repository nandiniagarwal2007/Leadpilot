<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeadPilot Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="layout">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>
            <i class="fa-solid fa-rocket"></i>
            LeadPilot
        </h2>

        <ul>

            <li>
                <a href="/" class="active">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-upload"></i>
                    Upload Leads
                </a>
            </li>

            <li>
                <a href="/history-page">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Campaigns
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-chart-column"></i>
                    Analytics
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="content">

        <div class="container">

            <!-- Top Bar -->

            <div class="topbar">

                <div>

                    <h1>Dashboard</h1>

                    <p>Welcome back, Admin 👋</p>

                </div>

                <div class="search">

                    <input
                        type="text"
                        placeholder="Search leads...">

                </div>

                <div class="profile">

                    <i class="fa-regular fa-bell"></i>

                    <span>

                        <i class="fa-regular fa-user"></i>

                        Admin

                    </span>

                </div>

            </div>

            <!-- Dashboard Cards -->

            <div class="dashboard">

                <div class="card leads">

                    <div class="icon">
                        <i class="fa-solid fa-users"></i>
                    </div>

                    <h2 id="totalLeads">0</h2>

                    <p>Total Leads</p>

                </div>

                <div class="card emails">

                    <div class="icon">
                        <i class="fa-solid fa-envelope"></i>
                    </div>

                    <h2 id="generatedEmails">0</h2>

                    <p>Generated Emails</p>

                </div>

                <div class="card sent">

                    <div class="icon">
                        <i class="fa-solid fa-paper-plane"></i>
                    </div>

                    <h2 id="sentEmails">0</h2>

                    <p>Emails Sent</p>

                </div>

            </div>

            <!-- Upload Section -->

            <section class="upload-section">

                <div class="upload-card">

                    <i class="fa-solid fa-file-csv upload-icon"></i>

                    <h2>Import Leads</h2>

                    <p>

                        Upload your CSV file and let AI generate personalized emails.

                    </p>

                    <button id="uploadBtn">

                        <i class="fa-solid fa-upload"></i>

                        Upload CSV

                    </button>

                    <input
                        type="file"
                        id="csvFile"
                        accept=".csv"
                        hidden>

                </div>

            </section>

                        <!-- Recent Activity -->

            <div class="activity">

    <h2>

        <i class="fa-solid fa-clock"></i>

        Recent Activity

    </h2>

    <div id="activityContainer"></div>

</div>

            </div>

            <!-- Leads Table -->

            <div id="leadsContainer"></div>

            <!-- Email Preview -->

            <div class="preview-card">

                <h2>

                    <i class="fa-solid fa-envelope-open-text"></i>

                    Email Preview

                </h2>

                <pre id="emailPreview"></pre>

            </div>

            <!-- Send Button -->

            <button id="sendBtn" style="display:none;">

                <i class="fa-solid fa-paper-plane"></i>

                Send Email

            </button>

            <!-- History -->

            <div id="historyContainer"></div>

        </div>

    </main>

</div>

<script src="/js/script.js"></script>

</body>

</html>
