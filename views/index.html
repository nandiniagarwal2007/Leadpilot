<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPilot</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="container">

    <h1>🚀 LeadPilot</h1>

    <p class="subtitle">
        AI Powered Sales Automation Platform
    </p>

    <div class="dashboard">

        <div class="card">
            <h2 id="totalLeads">0</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2 id="generatedEmails">0</h2>
            <p>Generated Emails</p>
        </div>

        <div class="card">
            <h2 id="sentEmails">0</h2>
            <p>Emails Sent</p>
        </div>

    </div>

    <button id="uploadBtn">
        Upload CSV
    </button>

    <input
        type="file"
        id="csvFile"
        accept=".csv"
        hidden>

    <div id="leadsContainer"></div>

    <h2>Email Preview</h2>

    <pre id="emailPreview"></pre>

    <button id="sendBtn" style="display:none;">
        📧 Send Email
    </button>

</div>

<script src="/js/script.js"></script>

</body>
</html>
